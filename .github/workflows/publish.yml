name: Publish

on:
  push:
    tags:
      - 'v*.*.*'

jobs:
  package:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: '22.23.4'
      - name: Enable pinned npm
        run: corepack enable npm && corepack prepare npm@10.9.8 --activate

      - name: Verify Node.js and npm
        run: node scripts/verify-runtime.mjs
      - name: Install dependencies without lifecycle scripts
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Audit root lifecycle scripts
        run: npm run security:audit-root
      - name: Audit dependency lifecycle scripts
        run: npm run deps:audit
      - name: Rebuild approved dependencies
        run: npm run deps:rebuild
      - name: Run lint
        run: npm run lint
      - name: Run tests
        run: npm test
      - name: Run build
        run: npm run build
      - name: Create package tarball without lifecycle scripts
        run: npm pack --ignore-scripts
      - name: Upload package tarball
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: npm-package-${{ github.sha }}
          path: '*.tgz'
          if-no-files-found: error
          retention-days: 1

  publish:
    needs: package
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: '22.23.4'
          registry-url: 'https://registry.npmjs.org/'
      - name: Enable pinned npm
        run: corepack enable npm && corepack prepare npm@10.9.8 --activate

      - name: Verify Node.js and npm
        run: test "$(node --version)" = 'v22.23.4' && test "$(npm --version)" = '10.9.8'
      - name: Download validated package tarball
        uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5
        with:
          name: npm-package-${{ github.sha }}
      - name: Publish package with provenance
        run: npm publish ./*.tgz --provenance --access public --ignore-scripts
