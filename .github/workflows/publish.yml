name: Publish

on:
  push:
    tags:
      - 'v*.*.*'

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'
          cache: 'npm'
      - run: npm install --global npm@latest
      - run: npm ci
      - run: npm test
      - run: npm run lint
      - run: npm run build
      - run: npm publish --access public --provenance
        env:
          # Needed only for the first publish. Remove the repository secret after
          # configuring this package's npm Trusted Publisher.
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
